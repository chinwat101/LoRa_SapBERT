# Training Configuration
training:
  # Paths
  output_dir: "outputs/checkpoints"
  logging_dir: "outputs/logs"

  # Masking
  mlm_probability: 0.15

  # Hyperparameters
  learning_rate: 2.0e-4
  num_train_epochs: 5
  per_device_train_batch_size: 32   # RTX 5060 8GB: 32 fits comfortably with seq_len=128
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1    # effective batch = 32 (was 16x2)
  warmup_ratio: 0.1
  weight_decay: 0.01

  # Tokenization
  max_seq_length: 128

  # Logging & checkpointing
  report_to: "tensorboard"   # set to "none" to disable
  logging_steps: 100
  eval_steps: 1000
  save_steps: 1000
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false

  # Precision
  fp16: false         # RTX 5060 (Blackwell) — use bf16 instead for better stability
  bf16: true          # Blackwell natively accelerates bf16

  # Reproducibility
  seed: 42

  # Resume from checkpoint
  resume_from_checkpoint: null  # set to checkpoint path to resume, e.g. "outputs/checkpoints/checkpoint-400"
