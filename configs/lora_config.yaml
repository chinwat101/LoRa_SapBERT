# LoRA Configuration
lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: "none"

  # Target modules to apply LoRA
  # Run scripts/inspect_model_modules.py to verify these names
  target_modules:
    - "query"
    - "key"
    - "value"
    - "dense"

  # Modules to completely unfreeze (for new vocabulary tokens)
  modules_to_save:
    - "word_embeddings"
    - "cls.predictions"

  # Task type for PEFT LoRA.
  # BERT is encoder-only → use FEATURE_EXTRACTION (the correct type for all PEFT versions).
  # The MLM head (cls.predictions) is trained fully via modules_to_save below,
  # so it does NOT need a special task_type to be updated during training.
  task_type: "FEATURE_EXTRACTION"

  # Inference mode (set false during training)
  inference_mode: false

  # Whether to save only adapter weights
  save_only_adapter: true
