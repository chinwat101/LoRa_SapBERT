# ──────────────────────────────────────────────────────────────────────────────
# WangchanBERTa MLM Continued Pre-training Configuration
# Task: Masked Language Modeling on domain corpus (TH biomedical text)
# ──────────────────────────────────────────────────────────────────────────────

model:
  base_model_path: "data/interim/wangchanberta"          # source (read-only)
  adapter_output_dir: "outputs/wangchan_mlm/adapter"    # save LoRA adapter here
  merged_model_dir:   "outputs/wangchan_mlm/merged"     # optional full merge

  lora_target_modules:
    - "query"
    - "key"
    - "value"
    - "dense"

data:
  # Path to domain corpus for MLM — plain text JSONL with {"text": "..."} records
  # Can reuse the NER dataset descriptions or any Thai domain text
  train_file: "data/processed/mlm_train.jsonl"
  val_file:   "data/processed/mlm_val.jsonl"

lora:
  r:            32
  lora_alpha:   64
  lora_dropout: 0.05
  bias:         "none"
  task_type:    "FEATURE_EXTRACTION"   # MLM uses full model, not TOKEN_CLS
  inference_mode: false
  save_only_adapter: true

training:
  output_dir: "outputs/wangchan_mlm/checkpoints"
  logging_dir: "outputs/wangchan_mlm/logs"

  mlm_probability: 0.15                # fraction of tokens masked

  num_train_epochs:             3
  per_device_train_batch_size:  16
  per_device_eval_batch_size:   16
  gradient_accumulation_steps:  2
  learning_rate:                2.0e-4
  warmup_ratio:                 0.1
  weight_decay:                 0.01
  max_seq_length:               128

  logging_steps:     100
  eval_steps:        500
  save_steps:        500
  save_total_limit:  3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false

  fp16:  true
  bf16:  false
  seed:  42

  resume_from_checkpoint: null
