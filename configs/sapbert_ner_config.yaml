# ──────────────────────────────────────────────────────────────────────────────
# SapBERT NER Fine-tuning Configuration
# Task: Token Classification (DRUG / DISEASE / SYMPTOM)
# ──────────────────────────────────────────────────────────────────────────────

model:
  # Base model path: if set to null or "", script will automatically find latest outputs/merged_model_N
  base_model_path: null
  output_root: "outputs"

  # LoRA target modules for BERT architecture
  lora_target_modules:
    - "query"
    - "key"
    - "value"
    - "dense"

data:
  train_file: "data/processed/ner_bio_th.jsonl"   # Thai NER examples
  val_file:   null                                 # auto-split from train (80/20)
  val_split:  0.2

  label_schema_file: "data/processed/ner_label_schema.json"

lora:
  r:            16
  lora_alpha:   32
  lora_dropout: 0.1
  bias:         "none"
  task_type:    "TOKEN_CLS"
  inference_mode: false

training:
  num_train_epochs:             100      # Small dataset — more epochs needed
  per_device_train_batch_size:  8
  per_device_eval_batch_size:   8
  gradient_accumulation_steps:  1
  learning_rate:                3.0e-4
  warmup_ratio:                 0.1
  weight_decay:                 0.01
  max_seq_length:               128

  logging_steps:     5
  eval_steps:        10
  save_steps:        10
  save_total_limit:  3
  load_best_model_at_end: true
  metric_for_best_model: "eval_f1"
  greater_is_better: true

  fp16:  true    # auto-disabled when no CUDA
  bf16:  false
  seed:  42

  resume_from_checkpoint: null
