# ─── Federated Learning Configuration ─────────────────────────────────────────
# Simulation: 2 clients บนเครื่องเดียว
# Client 0 → data/processed/ner_qa_train.jsonl  (โรงพยาบาล A — QA Medical)
# Client 1 → data/processed/ner_bio_th.jsonl    (โรงพยาบาล B — ฉลากยา)

federated:
  num_rounds: 10               # จำนวน FL rounds (global aggregation)
  num_clients: 2              # จำนวน clients (=จำนวน datasets)
  fraction_fit: 1.0           # ให้ทุก client เข้าร่วมเทรนทุก round
  fraction_evaluate: 1.0
  min_fit_clients: 2
  min_evaluate_clients: 2
  min_available_clients: 2
  strategy: "FedAvg"          # FedAvg | FedProx
  aggregation: "uniform"      # weighted (ถ่วงด้วย samples) | uniform (ทุก client เท่ากัน)

fedprox:
  proximal_mu: 0.1            # เปิดใช้เฉพาะตอน strategy = FedProx

# ─── ข้อมูลแต่ละ Client ───────────────────────────────────────────────────────
clients:
  - id: 0
    name: "Hospital_A_QA"
    train_file: "data/processed/ner_qa_train.jsonl"
    description: "QA Medical dataset (29,709 records)"
    local_epochs: 3            # 1 epoch = ~2,970 steps ต่อ round (สมดุล ไม่กลบ client เล็ก)
  - id: 1
    name: "Hospital_B_Labels"
    train_file: "data/processed/ner_bio_th.jsonl"
    description: "Drug label NER dataset (44 records)"
    local_epochs: 50           # 50 epochs = ~215 steps ต่อ round (ชดเชยข้อมูลขนาดเล็ก)

# ─── Local Training per Client per Round ─────────────────────────────────────
client:
  local_epochs: 5             # default fallback
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  learning_rate: 3.0e-4
  max_seq_length: 128
  val_split: 0.2              # 80/20 auto-split ของแต่ละ client

# ─── Base Model & Output ──────────────────────────────────────────────────────
model:
  base_model_path: "outputs/merged_model_3"
  output_dir: "outputs/fl_ner"    # global model บันทึกที่นี่ทุก round
  save_every_n_rounds: 1

# ─── LoRA Config (ต้องตรงกันทุก client) ──────────────────────────────────────
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  bias: "none"
  task_type: "TOKEN_CLS"
  target_modules: ["query", "key", "value", "dense"]

# ─── Label Schema ─────────────────────────────────────────────────────────────
data:
  label_schema_file: "data/processed/ner_label_schema.json"
  seed: 42

# ─── Training Misc ────────────────────────────────────────────────────────────
training:
  fp16: true
  seed: 42
